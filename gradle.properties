# Gradle / build infra
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Target stack. neoforge.mods.toml refers to these by name through
# generateModMetadata, so removing one breaks the build rather than the mod.
# Values are the verified 1.21.1 matrix from NEW_MOD_GUIDE.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
loader_version_range=[1,)

# Mod identity
mod_id=fissionreactoralerts
mod_name=Fission Reactor Alerts
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.kuronami.fissionreactoralerts
mod_authors=KURONAMI
mod_description=Server-side early warning for Mekanism fission reactors: when a formed reactor starts taking damage, the claiming team gets one alert, or nearby players when unclaimed. Never touches reactor state.

